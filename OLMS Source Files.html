e\", () =\u003e {\n    const sys = createSystem();\n    const customer = loginDemoCustomer(sys);\n    customer.addToCart(sys.productRepo.findById(\"P003\"), 1);\n    const order = customer.placeOrder(sys.orderService);\n    loginDemoStaff(sys).manageProduct(sys.productRepo, \"update\", { productID: \"P003\", name: \"Organic Brown Eggs (10s)\", price: 9.99, stockQuantity: 29 });\n    assertEqual(order.totalAmount, 4.2, \"totalAmount unchanged\");\n    assertEqual(order.getItems()[0].unitPrice, 4.2, \"unitPrice snapshot\");\n});\n\n// --- Staff: View Order / Update Order Status ---\ntest(\"Staff.viewOrder() sees customer orders and filters by status\", () =\u003e {\n    const sys = createSystem();\n    const customer = loginDemoCustomer(sys);\n    customer.addToCart(sys.productRepo.findById(\"P001\"), 1);\n    customer.placeOrder(sys.orderService);\n    const staff = loginDemoStaff(sys);\n    assertEqual(staff.viewOrder(sys.orderRepo).length, 1, \"all orders\");\n    assertEqual(staff.viewOrder(sys.orderRepo, OrderStatus.PENDING).length, 1, \"pending filter\");\n    assertEqual(staff.viewOrder(sys.orderRepo, OrderStatus.SHIPPED).length, 0, \"shipped filter\");\n});\n\ntest(\"Staff.updateOrderStatus() follows the lifecycle and the customer sees it\", () =\u003e {\n    const sys = createSystem();\n    const customer = loginDemoCustomer(sys);\n    customer.addToCart(sys.productRepo.findById(\"P001\"), 1);\n    const { orderID } = customer.placeOrder(sys.orderService);\n    const staff = loginDemoStaff(sys);\n    assertThrows(() =\u003e staff.updateOrderStatus(sys.orderService, orderID, OrderStatus.DELIVERED), \"Cannot change\");\n    [OrderStatus.PROCESSING, OrderStatus.SHIPPED, OrderStatus.DELIVERED].forEach(status =\u003e\n        staff.updateOrderStatus(sys.orderService, orderID, status));\n    assertEqual(customer.viewOrderStatus(sys.orderRepo)[0].getOrderStatus(), OrderStatus.DELIVERED, \"customer view\");\n    assertThrows(() =\u003e staff.updateOrderStatus(sys.orderService, orderID, OrderStatus.CANCELLED), \"Cannot change\");\n    assertThrows(() =\u003e staff.updateOrderStatus(sys.orderService, \"ORD9999\", OrderStatus.SHIPPED), \"not found\");\n});\n\ntest(\"Cancelling an order returns its stock to inventory\", () =\u003e {\n    const sys = createSystem();\n    const customer = loginDemoCustomer(sys);\n    customer.addToCart(sys.productRepo.findById(\"P004\"), 4);\n    const { orderID } = customer.placeOrder(sys.orderService);\n    assertEqual(sys.productRepo.findById(\"P004\").stockQuantity, 8, \"after order\");\n    loginDemoStaff(sys).updateOrderStatus(sys.orderService, orderID, OrderStatus.CANCELLED);\n    assertEqual(sys.productRepo.findById(\"P004\").stockQuantity, 12, \"after cancel\");\n});\n\ntest(\"Customers only see their own orders\", () =\u003e {\n    const sys = createSystem();\n    const demo = loginDemoCustomer(sys);\n    demo.addToCart(sys.productRepo.findById(\"P001\"), 1);\n    demo.placeOrder(sys.orderService);\n    const other = sys.authService.registerCustomer(\"Other\", \"other@example.com\", \"0111111111\", \"secret1\");\n    assertEqual(other.viewOrderStatus(sys.orderRepo).length, 0, \"other customer\u0027s orders\");\n    assertEqual(demo.viewOrderStatus(sys.orderRepo).length, 1, \"demo customer\u0027s orders\");\n});\n\n// --- Staff: Manage Product (Lab 3 \u0026 4 CRUD) ---\ntest(\"Staff.manageProduct() create/update/delete is visible to customers\", () =\u003e {\n    const sys = createSystem();\n    const staff = loginDemoStaff(sys);\n    staff.manageProduct(sys.productRepo, \"create\", { productID: \"p005\", name: \"Jasmine Rice 5kg\", price: \"18.90\", stockQuantity: \"40\" });\n    const customer = loginDemoCustomer(sys);\n    assertEqual(customer.browseProduct(sys.productRepo, \"rice\")[0].productID, \"P005\", \"created + ID normalised\");\n    staff.manageProduct(sys.productRepo, \"update\", { productID: \"P005\", name: \"Jasmine Rice 10kg\", price: 34, stockQuantity: 20 });\n    assertEqual(customer.viewProductDetails(sys.productRepo, \"P005\").name, \"Jasmine Rice 10kg\", \"updated\");\n    staff.manageProduct(sys.productRepo, \"delete\", { productID: \"P005\" });\n    assertThrows(() =\u003e customer.viewProductDetails(sys.productRepo, \"P005\"), \"no longer available\");\n    assertThrows(() =\u003e staff.manageProduct(sys.productRepo, \"delete\", { productID: \"P005\" }), \"no longer exists\");\n});\n\ntest(\"Product validation rejects bad IDs, duplicates, prices and stock\", () =\u003e {\n    const sys = createSystem();\n    const staff = loginDemoStaff(sys);\n    const create = data =\u003e staff.manageProduct(sys.productRepo, \"create\", { productID: \"P010\", name: \"Test\", price: 1, stockQuantity: 1, ...data });\n    assertThrows(() =\u003e create({ productID: \"X1\" }), \"Product ID must be\");\n    assertThrows(() =\u003e create({ productID: \"P001\" }), \"already exists\");\n    assertThrows(() =\u003e create({ name: \"   \" }), \"name cannot be empty\");\n    assertThrows(() =\u003e create({ price: -1 }), \"non-negative\");\n    assertThrows(() =\u003e create({ price: \"1.999\" }), \"2 decimal places\");\n    assertThrows(() =\u003e create({ stockQuantity: 2.5 }), \"non-negative integer\");\n    assertEqual(sys.productRepo.getAll().length, 4, \"nothing saved\");\n});\n\ntest(\"A failed product update leaves the product unchanged\", () =\u003e {\n    const sys = createSystem();\n    const staff = loginDemoStaff(sys);\n    assertThrows(() =\u003e staff.manageProduct(sys.productRepo, \"update\", { productID: \"P001\", name: \"Changed\", price: -5, stockQuantity: 1 }), \"non-negative\");\n    const product = sys.productRepo.findById(\"P001\");\n    assertEqual(product.name, \"Fresh Farm Milk 1L\", \"name kept\");\n    assertEqual(product.stockQuantity, 25, \"stock kept\");\n});\n\n// --- Runner ---\nfunction runAllTests() {\n    return testCases.map(({ name, fn }) =\u003e {\n        try {\n            fn();\n            return { name, passed: true };\n        } catch (err) {\n            return { name, passed: false, error: err.message };\n        }\n    });\n}\n\nfunction renderTestResults() {\n    const results = runAllTests();\n    const failed = results.filter(r =\u003e !r.passed).length;\n    const summary = document.getElementById(\"summary\");\n    summary.textContent = `${results.length - failed} / ${results.length} tests passed`;\n    summary.className = failed ? \"summary fail\" : \"summary pass\";\n    const list = document.getElementById(\"results\");\n    results.forEach(r =\u003e {\n        const item = document.createElement(\"li\");\n        item.className = r.passed ? \"pass\" : \"fail\";\n        item.textContent = `${r.passed ? \"PASS\" : \"FAIL\"} — ${r.name}${r.error ? ` → ${r.error}` : \"\"}`;\n        list.appendChild(item);\n    });\n    window.testResults = { total: results.length, failed, results };\n}\n\nrenderTestResults();\n"},{"group":"Docs","name":"README.md","dir":"OLMS/","purpose":"How to run the app and tests, demo accounts, and where each UML method lives.","content":"# OLMS — Integrated System\n\nIntegrates the four UML classes (**Customer, Staff, Product, Order**) into one working web app.\nThe Lab 3 \u0026 4 Product CRUD module (`OLMS Website_debugged.html`) is now the Staff \"Manage Product\" area.\n\n## How to run\n\n- **App:** open `index.html` in a browser (no build step, no server needed).\n- **Tests:** open `tests/IntegrationTests.html`. The page should show `18 / 18 tests passed`.\n\nData is held in memory, so refreshing the page resets to the demo data.\n\n### Demo accounts (test data only)\n\n| Role | Email | Password |\n| :--- | :--- | :--- |\n| Customer | customer@olms.test | customer123 |\n| Staff (Manager) | staff@olms.test | staff123 |\n\nNew customers can also self-register on the login screen.\n\n## Structure (layered MVC/Service, one class per file)\n\n```\nOLMS/\n├── index.html                  UI for both roles\n├── css/styles.css\n├── js/models/                  Domain layer (UML classes)\n│   ├── Customer.js  Staff.js  Product.js  Order.js\n│   ├── OrderStatus.js          OrderStatus enum + allowed transitions\n│   └── Validator.js            Shared input rules\n├── js/repositories/            Data layer (in-memory storage)\n├── js/services/                OrderService, AuthService, SystemFactory (wiring + seed data)\n├── js/ui/                      Controllers, one per area\n└── tests/                      Integration tests\n```\n\n## UML method → code\n\n| UML method | Where | Used by |\n| :--- | :--- | :--- |\n| Customer.register() | `Customer.register()` | Register form |\n| Customer / Staff.login() | `login(password)` via `AuthService.login()` | Login form |\n| Customer.browseProduct() | `Customer.browseProduct()` | Browse Products |\n| Customer.viewProductDetails() | `Customer.viewProductDetails()` → `Product.getDetails()` | Details button |\n| Customer.placeOrder() | `Customer.placeOrder()` → `OrderService.placeOrder()` → `Order.createOrder()` | Place Order |\n| Customer.viewOrderStatus() | `Customer.viewOrderStatus()` | My Orders |\n| Staff.manageProduct() | `Staff.manageProduct(repo, \"create\" / \"update\" / \"delete\")` | Sections 1–5 |\n| Staff.viewOrder() | `Staff.viewOrder()` | Customer Orders |\n| Staff.updateOrderStatus() | `Staff.updateOrderStatus()` → `Order.updateStatus()` | Update button |\n| Product.updateProduct() | `Product.updateProduct()` | Save Changes |\n| Order.getOrderStatus() | `Order.getOrderStatus()` | Status badges |\n\n## Integration rules\n\n- **Placing an order is all-or-nothing.** Every cart line is checked against stock before any stock is reduced.\n- **Orders keep the price paid.** Each order stores the unit price at the moment it was placed.\n- **Order statuses only move forward:** Pending → Processing → Shipped → Delivered. An order can be cancelled only before it ships, and cancelling returns its stock.\n- **Deleted products:** a deleted product cannot be ordered; customers are told to remove it from their cart.\n\n## Additions beyond the UML diagram\n\n- A **cart** on Customer (`addToCart`, `removeFromCart`, `getCart`, `clearCart`), which `placeOrder()` needs.\n- A private **password** field on Customer and Staff, because `login()` has to verify something. Passwords are stored in plain text; this is acceptable for an in-memory demo but not for production.\n- **Cancelled** status and `Order.getNextStatuses()`.\n- **Product ID format** `P` followed by 3 or more digits, and prices limited to 2 decimal places.\n"}];
const CATEGORIES = [
    { name: "Page", token: "page", about: "The web page and its styling." },
    { name: "Classes", token: "classes", about: "The four UML classes (Product, Customer, Staff, Order) plus the OrderStatus list and shared input checks." },
    { name: "Repositories", token: "repositories", about: "Where each class's records are stored and looked up." },
    { name: "Services", token: "services", about: "Steps that involve several classes at once: placing orders, logging in, and connecting everything together." },
    { name: "Functions (UI)", token: "functions", about: "The functions behind each screen and button. App.js must load last." },
    { name: "Tests", token: "tests", about: "Open IntegrationTests.html in a browser to run all 18 integration tests." },
    { name: "Docs", token: "docs", about: "How to run the app, the demo accounts, and where each UML method lives." }
].filter(c => FILES.some(f => f.group === c.name));
let currentCategory = 0;

function buildTabs() {
    const tabs = document.getElementById("tabs");
    CATEGORIES.forEach((category, index) => {
        const tab = document.createElement("button");
        tab.type = "button";
        tab.className = "tab";
        tab.dataset.index = index;
        tab.innerHTML = '<span class="label"></span><span class="count"></span>';
        tab.querySelector(".label").textContent = category.name;
        tab.querySelector(".count").textContent = FILES.filter(f => f.group === category.name).length;
        tab.onclick = () => showCategory(index, true);
        tabs.appendChild(tab);
    });
}

function buildFileCard(file) {
    const card = document.createElement("section");
    card.className = "file";
    card.innerHTML =
        '<div class="file-head"><div class="titles"><span class="save-as">Save as</span>' +
        '<span class="path"><span class="dir"></span><span class="name"></span></span>' +
        '<span class="purpose"></span></div><button type="button" class="btn">Copy code</button></div>' +
        '<div class="status" role="status"></div><div class="code-wrap"><pre tabindex="0"></pre></div>';
    card.querySelector(".dir").textContent = file.dir;
    card.querySelector(".name").textContent = file.name;
    const lines = file.content.split("\n").length;
    card.querySelector(".purpose").textContent = `${file.purpose} (${lines} lines)`;
    card.querySelector("pre").textContent = file.content;
    card.querySelector("button").onclick = () => copyFile(file, card);
    return card;
}

function showCategory(index, scroll) {
    currentCategory = index;
    const category = CATEGORIES[index];
    const files = FILES.filter(f => f.group === category.name);
    document.getElementById("pageTitle").textContent = category.name;
    document.getElementById("pageAbout").textContent = category.about;
    document.getElementById("pageMeta").textContent =
        `Page ${index + 1} of ${CATEGORIES.length} · ${files.length} file${files.length === 1 ? "" : "s"}`;
    document.getElementById("fileList").replaceChildren(...files.map(buildFileCard));
    document.querySelectorAll(".tab").forEach(tab => {
        if (Number(tab.dataset.index) === index) tab.setAttribute("aria-current", "page");
        else tab.removeAttribute("aria-current");
    });
    setPager("prevBtn", index - 1, true);
    setPager("nextBtn", index + 1, false);
    try { history.replaceState(null, "", "#" + category.token); } catch (e) {}
    if (scroll) document.getElementById("tabs").scrollIntoView({ block: "start" });
}

function setPager(id, target, isPrev) {
    const btn = document.getElementById(id);
    const category = CATEGORIES[target];
    btn.disabled = !category;
    btn.textContent = category ? (isPrev ? `← ${category.name}` : `${category.name} →`) : (isPrev ? "← Start" : "End →");
    btn.onclick = category ? () => showCategory(target, true) : null;
}

async function copyFile(file, card) {
    const status = card.querySelector(".status");
    try {
        await navigator.clipboard.writeText(file.content);
        status.textContent = `Copied. Paste it into ${file.dir}${file.name}.`;
    } catch (e) {
        const range = document.createRange();
        range.selectNodeContents(card.querySelector("pre"));
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        status.textContent = "The code is selected. Press Ctrl+C (or Cmd+C) to copy it.";
    }
}

buildTabs();
const startIndex = CATEGORIES.findIndex(c => "#" + c.token === location.hash);
showCategory(startIndex >= 0 ? startIndex : 0, false);
</script>
