<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OLMS Source Files</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: category tabs across the top; each category page stacks its files, each with its own copy button */
:root {
    --bg: #f3f5f4;
    --surface: #ffffff;
    --ink: #17221f;
    --muted: #5b6b66;
    --line: #dbe2df;
    --accent: #0f766e;
    --accent-soft: #e0f2ef;
    --code-bg: #f8faf9;
    --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg: #0f1514; --surface: #161e1c; --ink: #e3ebe8; --muted: #93a39e;
        --line: #26322f; --accent: #3cc2b2; --accent-soft: #15302c; --code-bg: #111816;
        color-scheme: dark;
    }
}
:root[data-theme="dark"] {
    --bg: #0f1514; --surface: #161e1c; --ink: #e3ebe8; --muted: #93a39e;
    --line: #26322f; --accent: #3cc2b2; --accent-soft: #15302c; --code-bg: #111816;
    color-scheme: dark;
}

body {
    background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
}
.shell { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px; }

header.intro { display: grid; gap: 6px; }
header.intro h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
header.intro p { color: var(--muted); max-width: 72ch; }

nav.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab {
    font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    display: inline-flex; gap: 8px; align-items: center;
}
.tab .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tab[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.tab[aria-current="page"] .count { color: var(--surface); opacity: 0.85; }

main { min-width: 0; display: grid; gap: 16px; }
.page-head { display: grid; gap: 4px; }
.page-head h2 { font-size: 22px; font-weight: 700; }
.page-head p { color: var(--muted); max-width: 72ch; }
.page-head .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.file { min-width: 0; display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.file-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; }
.file-head .titles { display: grid; gap: 2px; min-width: 0; }
.save-as { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.path { font-family: var(--font-mono); font-size: 15px; overflow-wrap: anywhere; }
.path .dir { color: var(--muted); }
.path .name { font-weight: 500; }
.purpose { color: var(--muted); font-size: 14px; max-width: 72ch; }
.status { font-size: 13px; color: var(--accent); min-height: 1.2em; }

button.btn {
    font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--surface); white-space: nowrap;
}
button.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); font-weight: 500; }
button.btn:disabled { opacity: 0.45; cursor: default; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.code-wrap { border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); overflow: auto; max-height: 520px; }
pre { margin: 0; padding: 14px 16px; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; tab-size: 4; white-space: pre; }
.pager { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
</style>

<div class="shell">
    <header class="intro">
        <h1>OLMS Source Files</h1>
        <p>One page per category. Each file has its own <strong>Copy code</strong> button. Save each one at the path shown, using that exact file name, so <code>index.html</code> can find it.</p>
    </header>
    <nav class="tabs" id="tabs" aria-label="Categories"></nav>
    <main>
        <div class="page-head">
            <h2 id="pageTitle"></h2>
            <p id="pageAbout"></p>
            <span class="meta" id="pageMeta"></span>
        </div>
        <div id="fileList" style="display: grid; gap: 16px;"></div>
        <div class="pager">
            <button type="button" class="btn ghost" id="prevBtn"></button>
            <button type="button" class="btn ghost" id="nextBtn"></button>
        </div>
    </main>
</div>

<script>
const FILES = [{"group":"Page","name":"index.html","dir":"OLMS/","purpose":"The single web page for both roles: login/register, customer screens and staff screens. Loads every script below in order.","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eOLMS - Online Local Mart System\u003c/title\u003e\n    \u003clink rel=\"stylesheet\" href=\"css/styles.css\"\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n\u003cdiv class=\"container\"\u003e\n    \u003cheader\u003e\n        \u003cdiv\u003e\n            \u003ch1\u003eOnline Local Mart System (OLMS)\u003c/h1\u003e\n            \u003cp class=\"meta-text\"\u003eCSEB5223: Software Construction — Integrated System (Customer · Staff · Product · Order)\u003c/p\u003e\n        \u003c/div\u003e\n        \u003cdiv id=\"sessionInfo\" class=\"meta-text nav-session hidden\"\u003e\n            \u003cspan\u003eSigned in as \u003cstrong id=\"sessionName\"\u003e\u003c/strong\u003e\u003cbr\u003e\u003cspan id=\"sessionRole\"\u003e\u003c/span\u003e\u003c/span\u003e\n            \u003cbutton type=\"button\" class=\"btn-secondary\" onclick=\"handleLogout()\"\u003eLog out\u003c/button\u003e\n        \u003c/div\u003e\n    \u003c/header\u003e\n\n    \u003c!-- ===================================================================== --\u003e\n    \u003c!-- USE CASE: REGISTER / LOGIN --\u003e\n    \u003c!-- ===================================================================== --\u003e\n    \u003csection id=\"authView\" class=\"grid\"\u003e\n        \u003cdiv class=\"card\"\u003e\n            \u003ch2\u003eLogin\u003c/h2\u003e\n            \u003cform id=\"loginForm\" onsubmit=\"handleLogin(event)\"\u003e\n                \u003cdiv class=\"form-group\"\u003e\n                    \u003clabel for=\"login_role\"\u003eLogin as:\u003c/label\u003e\n                    \u003cselect id=\"login_role\"\u003e\n                        \u003coption value=\"customer\"\u003eCustomer\u003c/option\u003e\n                        \u003coption value=\"staff\"\u003eStaff\u003c/option\u003e\n                    \u003c/select\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"form-group\"\u003e\n                    \u003clabel for=\"login_email\"\u003eEmail:\u003c/label\u003e\n                    \u003cinput type=\"email\" id=\"login_email\" required autocomplete=\"username\"\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"form-group\"\u003e\n                    \u003clabel for=\"login_password\"\u003ePassword:\u003c/label\u003e\n                    \u003cinput type=\"password\" id=\"login_password\" required autocomplete=\"current-password\"\u003e\n                \u003c/div\u003e\n                \u003cbutton type=\"submit\" class=\"btn-block\"\u003eLogin\u003c/button\u003e\n            \u003c/form\u003e\n            \u003cdiv id=\"loginFeedback\" class=\"message-box\"\u003e\u003c/div\u003e\n            \u003cp class=\"meta-text hint\"\u003eDemo accounts are listed in OLMS/README.md.\u003c/p\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"card\"\u003e\n            \u003ch2\u003eRegister (New Customer)\u003c/h2\u003e\n            \u003cform id=\"registerForm\" onsubmit=\"handleRegister(event)\"\u003e\n                \u003cdiv class=\"form-group\"\u003e\n                    \u003clabel for=\"register_name\"\u003eFull Name:\u003c/label\u003e\n                    \u003cinput type=\"text\" id=\"register_name\" required autocomplete=\"name\"\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"form-group\"\u003e\n                    \u003clabel for=\"register_email\"\u003eEmail:\u003c/label\u003e\n                    \u003cinput type=\"email\" id=\"register_email\" required autocomplete=\"email\"\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"form-row\" style=\"margin-top: 0;\"\u003e\n                    \u003cdiv class=\"form-group\" style=\"flex: 1;\"\u003e\n                        \u003clabel for=\"register_phone\"\u003ePhone:\u003c/label\u003e\n                        \u003cinput type=\"tel\" id=\"register_phone\" required placeholder=\"012-3456789\" autocomplete=\"tel\"\u003e\n                    \u003c/div\u003e\n                    \u003cdiv class=\"form-group\" style=\"flex: 1;\"\u003e\n                        \u003clabel for=\"register_password\"\u003ePassword (min 6):\u003c/label\u003e\n                        \u003cinput type=\"password\" id=\"register_password\" required minlength=\"6\" autocomplete=\"new-password\"\u003e\n                    \u003c/div\u003e\n                \u003c/div\u003e\n                \u003cbutton type=\"submit\" class=\"btn-block\"\u003eCreate Account\u003c/button\u003e\n            \u003c/form\u003e\n            \u003cdiv id=\"registerFeedback\" class=\"message-box\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003c!-- ===================================================================== --\u003e\n    \u003c!-- CUSTOMER VIEW: Browse · View Details · Place Order · View Order Status --\u003e\n    \u003c!-- ===================================================================== --\u003e\n    \u003csection id=\"customerView\" class=\"hidden\"\u003e\n        \u003cdiv class=\"grid\"\u003e\n            \u003cdiv class=\"card\"\u003e\n                \u003ch2\u003eBrowse Products\u003c/h2\u003e\n                \u003cform onsubmit=\"handleBrowseProducts(event)\"\u003e\n                    \u003cdiv class=\"form-row\" style=\"margin-top: 0;\"\u003e\n                        \u003cinput type=\"text\" id=\"browse_query\" placeholder=\"Search by name or ID...\" aria-label=\"Search products\" style=\"flex: 2;\"\u003e\n                        \u003cbutton type=\"submit\" style=\"flex: 1;\"\u003eSearch\u003c/button\u003e\n                        \u003cbutton type=\"button\" class=\"btn-secondary\" onclick=\"handleShowAllProducts()\" style=\"flex: 1;\"\u003eShow All\u003c/button\u003e\n                    \u003c/div\u003e\n                \u003c/form\u003e\n                \u003cdiv id=\"browseFeedback\" class=\"message-box\"\u003e\u003c/div\u003e\n                \u003cdiv id=\"catalogueDisplay\"\u003e\u003c/div\u003e\n            \u003c/div\u003e\n\n            \u003cdiv class=\"card\"\u003e\n                \u003ch2\u003eProduct Details\u003c/h2\u003e\n                \u003cdiv id=\"productDetailsDisplay\" class=\"meta-text\"\u003e\u003c/div\u003e\n\n                \u003ch2 class=\"section-gap\"\u003eMy Cart\u003c/h2\u003e\n                \u003cdiv id=\"cartDisplay\"\u003e\u003c/div\u003e\n                \u003cdiv id=\"cartTotal\" class=\"cart-total\"\u003e\u003c/div\u003e\n                \u003cbutton type=\"button\" id=\"placeOrderBtn\" class=\"btn-block\" onclick=\"handlePlaceOrder()\"\u003ePlace Order\u003c/button\u003e\n                \u003cdiv id=\"cartFeedback\" class=\"message-box\"\u003e\u003c/div\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003cdiv class=\"card-full\"\u003e\n            \u003ch2\u003eMy Orders (Order Status)\u003c/h2\u003e\n            \u003cdiv id=\"customerOrdersDisplay\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/section\u003e\n\n    \u003c!-- ===================================================================== --\u003e\n    \u003c!-- STAFF VIEW: Manage Product (Lab 3 \u0026 4 CRUD) · View Order · Update Status --\u003e\n    \u003c!-- ===================================================================== --\u003e\n    \u003csection id=\"staffView\" class=\"hidden\"\u003e\n        \u003cdiv class=\"grid\"\u003e\n            \u003c!-- 1. CREATE FUNCTION CONSTRUCTION --\u003e\n            \u003cdiv class=\"card\"\u003e\n                \u003ch2\u003e1. Create Product\u003c/h2\u003e\n                \u003cform id=\"createProductForm\" onsubmit=\"handleCreateProduct(event)\"\u003e\n                    \u003cdiv class=\"form-group\"\u003e\n                        \u003clabel for=\"create_productID\"\u003eProduct ID (e.g., P005):\u003c/label\u003e\n                        \u003cinput type=\"text\" id=\"create_productID\" required placeholder=\"P005\"\u003e\n                    \u003c/div\u003e\n                    \u003cdiv class=\"form-group\"\u003e\n                        \u003clabel for=\"create_name\"\u003eProduct Name:\u003c/label\u003e\n                        \u003cinput type=\"text\" id=\"create_name\" required placeholder=\"Product title\"\u003e\n                    \u003c/div\u003e\n                    \u003cdiv class=\"form-row\"\u003e\n                        \u003cdiv class=\"form-group\" style=\"flex: 1;\"\u003e\n                            \u003clabel for=\"create_price\"\u003ePrice ($):\u003c/label\u003e\n                            \u003cinput type=\"number\" step=\"0.01\" min=\"0\" id=\"create_price\" required placeholder=\"0.00\"\u003e\n                        \u003c/div\u003e\n                        \u003cdiv class=\"form-group\" style=\"flex: 1;\"\u003e\n                            \u003clabel for=\"create_stockQuantity\"\u003eStock Quantity:\u003c/label\u003e\n                            \u003cinput type=\"number\" min=\"0\" id=\"create_stockQuantity\" required placeholder=\"0\"\u003e\n                        \u003c/div\u003e\n                    \u003c/div\u003e\n                    \u003cbutton type=\"submit\" class=\"btn-block\"\u003eAdd Product to Inventory\u003c/button\u003e\n                \u003c/form\u003e\n                \u003cdiv id=\"createFeedback\" class=\"message-box\"\u003e\u003c/div\u003e\n            \u003c/div\u003e\n\n            \u003c!-- 2. SEARCH FUNCTION CONSTRUCTION --\u003e\n            \u003cdiv class=\"card\"\u003e\n                \u003ch2\u003e2. Search Product\u003c/h2\u003e\n                \u003cform onsubmit=\"handleSearchProduct(event)\"\u003e\n                    \u003cdiv class=\"form-group\"\u003e\n                        \u003clabel for=\"search_query\"\u003eSearch by Product ID or Name:\u003c/label\u003e\n                        \u003cdiv class=\"form-row\" style=\"margin-top: 0;\"\u003e\n                            \u003cinput type=\"text\" id=\"search_query\" required placeholder=\"Enter ID (P001) or Name...\" style=\"flex: 2;\"\u003e\n                            \u003cbutton type=\"submit\" style=\"flex: 1;\"\u003eSearch\u003c/button\u003e\n                        \u003c/div\u003e\n                    \u003c/div\u003e\n                \u003c/form\u003e\n                \u003cdiv id=\"searchFeedback\" class=\"message-box\"\u003e\u003c/div\u003e\n                \u003cdiv id=\"searchResultsDisplay\"\u003e\u003c/div\u003e\n            \u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003c!-- 3 \u0026 4. EDIT \u0026 DELETE WORKSPACE --\u003e\n        \u003cdiv id=\"editDeleteSection\" class=\"card-full hidden\"\u003e\n            \u003ch2 id=\"editTitle\"\u003e3 \u0026 4. Edit / Delete Product\u003c/h2\u003e\n            \u003cform id=\"editForm\" onsubmit=\"handleSaveEdit(event)\"\u003e\n                \u003cinput type=\"hidden\" id=\"edit_productID\"\u003e\n                \u003cdiv class=\"form-row\"\u003e\n                    \u003cdiv class=\"form-group\" style=\"flex: 2;\"\u003e\n                        \u003clabel for=\"edit_name\"\u003eProduct Name:\u003c/label\u003e\n                        \u003cinput type=\"text\" id=\"edit_name\" required\u003e\n                    \u003c/div\u003e\n                    \u003cdiv class=\"form-group\" style=\"flex: 1;\"\u003e\n                        \u003clabel for=\"edit_price\"\u003ePrice ($):\u003c/label\u003e\n                        \u003cinput type=\"number\" step=\"0.01\" min=\"0\" id=\"edit_price\" required\u003e\n                    \u003c/div\u003e\n                    \u003cdiv class=\"form-group\" style=\"flex: 1;\"\u003e\n                        \u003clabel for=\"edit_stockQuantity\"\u003eStock Quantity:\u003c/label\u003e\n                        \u003cinput type=\"number\" min=\"0\" id=\"edit_stockQuantity\" required\u003e\n                    \u003c/div\u003e\n                \u003c/div\u003e\n                \u003cdiv class=\"form-row\"\u003e\n                    \u003cbutton type=\"submit\" style=\"flex: 1;\"\u003eSave Changes\u003c/button\u003e\n                    \u003cbutton type=\"button\" class=\"btn-danger\" onclick=\"handleDeletePrompt()\" style=\"flex: 1;\"\u003eDelete Product\u003c/button\u003e\n                    \u003cbutton type=\"button\" class=\"btn-secondary\" onclick=\"closeEditWorkspace()\" style=\"flex: 1;\"\u003eCancel\u003c/button\u003e\n                \u003c/div\u003e\n            \u003c/form\u003e\n            \u003cdiv id=\"editFeedback\" class=\"message-box\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003c!-- 5. DATA DISPLAY FUNCTION CONSTRUCTION --\u003e\n        \u003cdiv class=\"card-full\"\u003e\n            \u003ch2\u003e5. Product Inventory\u003c/h2\u003e\n            \u003cdiv id=\"inventoryDisplay\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n\n        \u003c!-- 6. ORDER MANAGEMENT (View Order · Update Order Status) --\u003e\n        \u003cdiv class=\"card-full\"\u003e\n            \u003cdiv class=\"section-heading\"\u003e\n                \u003ch2\u003e6. Customer Orders\u003c/h2\u003e\n                \u003cselect id=\"order_status_filter\" class=\"status-select\" aria-label=\"Filter orders by status\" onchange=\"renderOrderManagement()\"\u003e\n                    \u003coption value=\"\"\u003eAll statuses\u003c/option\u003e\n                    \u003coption value=\"Pending\"\u003ePending\u003c/option\u003e\n                    \u003coption value=\"Processing\"\u003eProcessing\u003c/option\u003e\n                    \u003coption value=\"Shipped\"\u003eShipped\u003c/option\u003e\n                    \u003coption value=\"Delivered\"\u003eDelivered\u003c/option\u003e\n                    \u003coption value=\"Cancelled\"\u003eCancelled\u003c/option\u003e\n                \u003c/select\u003e\n            \u003c/div\u003e\n            \u003cdiv id=\"orderFeedback\" class=\"message-box\"\u003e\u003c/div\u003e\n            \u003cdiv id=\"orderManagementDisplay\"\u003e\u003c/div\u003e\n        \u003c/div\u003e\n    \u003c/section\u003e\n\u003c/div\u003e\n\n\u003c!-- Domain layer (models) --\u003e\n\u003cscript src=\"js/models/OrderStatus.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"js/models/Validator.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"js/models/Product.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"js/models/Customer.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"js/models/Staff.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"js/models/Order.js\"\u003e\u003c/script\u003e\n\u003c!-- Data layer (repositories) --\u003e\n\u003cscript src=\"js/repositories/ProductRepository.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"js/repositories/CustomerRepository.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"js/repositories/StaffRepository.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"js/repositories/OrderRepository.js\"\u003e\u003c/script\u003e\n\u003c!-- Service layer --\u003e\n\u003cscript src=\"js/services/OrderService.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"js/services/AuthService.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"js/services/SystemFactory.js\"\u003e\u003c/script\u003e\n\u003c!-- Presentation layer (controllers) --\u003e\n\u003cscript src=\"js/ui/UiHelpers.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"js/ui/AuthController.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"js/ui/CustomerController.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"js/ui/StaffProductController.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"js/ui/StaffOrderController.js\"\u003e\u003c/script\u003e\n\u003cscript src=\"js/ui/App.js\"\u003e\u003c/script\u003e\n\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"group":"Page","name":"styles.css","dir":"OLMS/css/","purpose":"All styling for index.html, including order status badges and the phone layout.","content":":root {\n    --primary: #2563eb;\n    --danger: #dc2626;\n    --success: #16a34a;\n    --dark: #0f172a;\n    --gray-light: #f8fafc;\n    --border: #e2e8f0;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif; }\nbody { background: #f1f5f9; color: #334155; padding: 24px; }\n.container { max-width: 1100px; margin: 0 auto; }\n.hidden { display: none !important; }\n\nheader {\n    background: #fff; padding: 20px 24px; border-radius: 8px;\n    border: 1px solid var(--border); margin-bottom: 20px;\n    display: flex; justify-content: space-between; align-items: center; gap: 12px;\n}\nh1 { font-size: 22px; color: var(--dark); }\n.meta-text { font-size: 13px; color: #64748b; }\n.nav-session { display: flex; align-items: center; gap: 12px; text-align: right; }\n.hint { margin-top: 12px; }\n\n.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }\n.card { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid var(--border); }\n.card-full { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }\nh2 { font-size: 16px; margin-bottom: 12px; color: var(--dark); border-bottom: 2px solid var(--border); padding-bottom: 8px; }\n.section-gap { margin-top: 24px; }\n.section-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }\n.section-heading h2 { flex: 1; }\n\n.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }\nlabel { font-size: 12px; font-weight: 600; color: #475569; }\ninput, select, button { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; outline: none; }\ninput:focus, select:focus { border-color: var(--primary); }\nselect { background: #fff; }\n.form-row { display: flex; gap: 10px; margin-top: 10px; }\n\nbutton { background-color: var(--primary); color: #fff; border: none; cursor: pointer; font-weight: 500; }\nbutton:hover { opacity: 0.9; }\nbutton:disabled { opacity: 0.5; cursor: not-allowed; }\nbutton.btn-danger { background-color: var(--danger); }\nbutton.btn-secondary { background-color: #64748b; }\n.btn-block { width: 100%; margin-top: 6px; }\n\n/* Status \u0026 Alert Messages */\n.message-box { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-top: 10px; display: none; }\n.msg-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block; }\n.msg-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }\n.msg-info { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; display: block; }\n\ntable { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }\nth, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }\nth { background: #f8fafc; color: #475569; font-weight: 600; }\n.empty-cell { text-align: center; color: #94a3b8; }\n.btn-action { padding: 4px 8px; font-size: 11px; margin-right: 4px; border-radius: 4px; }\n.qty-input { width: 60px; padding: 4px 6px; font-size: 12px; margin-right: 4px; }\n.status-select { padding: 4px 6px; font-size: 12px; margin-right: 4px; }\n\n.cart-total { text-align: right; font-weight: 600; color: var(--dark); margin-top: 10px; }\n.details-list { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; }\n.details-list dt { font-weight: 600; color: #475569; }\n.details-list dd { color: var(--dark); }\n\n/* Order status badges */\n.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }\n.badge-pending { background: #fef9c3; color: #854d0e; }\n.badge-processing { background: #e0f2fe; color: #075985; }\n.badge-shipped { background: #ede9fe; color: #5b21b6; }\n.badge-delivered { background: #dcfce7; color: #166534; }\n.badge-cancelled { background: #f1f5f9; color: #475569; }\n\n@media (max-width: 760px) {\n    body { padding: 12px; }\n    header { flex-direction: column; align-items: flex-start; }\n    .nav-session { text-align: left; }\n    .grid { grid-template-columns: 1fr; }\n    .form-row { flex-wrap: wrap; }\n    .table-scroll { overflow-x: auto; }\n}\n"},{"group":"Classes","name":"OrderStatus.js","dir":"OLMS/js/models/","purpose":"OrderStatus enum (Pending, Processing, Shipped, Delivered, Cancelled) and the allowed status changes.","content":"/**\n * OrderStatus Enumeration\n * Constants use UPPER_SNAKE_CASE keys per Naming Conventions 3(a)\n */\nconst OrderStatus = Object.freeze({\n    PENDING: \"Pending\",\n    PROCESSING: \"Processing\",\n    SHIPPED: \"Shipped\",\n    DELIVERED: \"Delivered\",\n    CANCELLED: \"Cancelled\"\n});\n\n// Allowed lifecycle: Pending -\u003e Processing -\u003e Shipped -\u003e Delivered (cancel only before shipping)\nconst ORDER_STATUS_FLOW = Object.freeze({\n    [OrderStatus.PENDING]: [OrderStatus.PROCESSING, OrderStatus.CANCELLED],\n    [OrderStatus.PROCESSING]: [OrderStatus.SHIPPED, OrderStatus.CANCELLED],\n    [OrderStatus.SHIPPED]: [OrderStatus.DELIVERED],\n    [OrderStatus.DELIVERED]: [],\n    [OrderStatus.CANCELLED]: []\n});\n"},{"group":"Classes","name":"Validator.js","dir":"OLMS/js/models/","purpose":"Shared checks for names, emails, phone numbers and passwords used by Customer and Staff.","content":"/**\n * Validator — shared input rules for Customer and Staff entities\n */\nconst Validator = Object.freeze({\n    requireText(value, label) {\n        if (typeof value !== \"string\" || value.trim() === \"\") throw new Error(`${label} cannot be empty.`);\n        return value.trim();\n    },\n\n    email(value) {\n        const email = String(value ?? \"\").trim().toLowerCase();\n        if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) throw new Error(\"Please enter a valid email address.\");\n        return email;\n    },\n\n    phone(value) {\n        const phone = String(value ?? \"\").trim();\n        if (!/^\\+?[0-9][0-9\\s-]{6,18}$/.test(phone)) throw new Error(\"Phone must contain 7-19 digits (spaces and dashes allowed).\");\n        return phone;\n    },\n\n    password(value) {\n        const password = String(value ?? \"\");\n        if (password.length \u003c 6) throw new Error(\"Password must be at least 6 characters.\");\n        return password;\n    }\n});\n"},{"group":"Classes","name":"Product.js","dir":"OLMS/js/models/","purpose":"Product class: private fields, validating setters, getDetails(), updateProduct(), plus stock methods used by orders.","content":"/**\n * Product Entity Class\n * Encapsulation: Strict private fields with explicit Getters \u0026 Setters\n * UML: getDetails(), updateProduct()\n */\nclass Product {\n    #productID;\n    #name;\n    #price;\n    #stockQuantity;\n\n    constructor(productID, name, price, stockQuantity) {\n        this.#productID = Product.#validateID(productID);\n        this.name = name;\n        this.price = price;\n        this.stockQuantity = stockQuantity;\n    }\n\n    // --- Getters ---\n    get productID() { return this.#productID; }\n    get name() { return this.#name; }\n    get price() { return this.#price; }\n    get stockQuantity() { return this.#stockQuantity; }\n\n    // --- Setters ---\n    set name(value) {\n        if (typeof value !== \"string\" || value.trim() === \"\") throw new Error(\"Product name cannot be empty.\");\n        this.#name = value.trim();\n    }\n\n    set price(value) {\n        const parsed = Number(value);\n        if (String(value).trim() === \"\" || !Number.isFinite(parsed) || parsed \u003c 0) throw new Error(\"Price must be a non-negative decimal.\");\n        if (Math.abs(parsed * 100 - Math.round(parsed * 100)) \u003e 1e-6) throw new Error(\"Price can have at most 2 decimal places.\");\n        this.#price = Math.round(parsed * 100) / 100;\n    }\n\n    set stockQuantity(value) {\n        const parsed = Number(value);\n        if (String(value).trim() === \"\" || !Number.isSafeInteger(parsed) || parsed \u003c 0) throw new Error(\"stockQuantity must be a non-negative integer.\");\n        this.#stockQuantity = parsed;\n    }\n\n    // --- UML Methods ---\n    getDetails() {\n        return {\n            productID: this.#productID,\n            name: this.#name,\n            price: this.#price,\n            stockQuantity: this.#stockQuantity\n        };\n    }\n\n    updateProduct(name, price, stockQuantity) {\n        const validated = new Product(this.#productID, name, price, stockQuantity);\n        this.#name = validated.name;\n        this.#price = validated.price;\n        this.#stockQuantity = validated.stockQuantity;\n    }\n\n    // --- Order integration: stock movements ---\n    reduceStock(quantity) {\n        const amount = Product.toQuantity(quantity);\n        if (amount \u003e this.#stockQuantity) {\n            throw new Error(`Insufficient stock for \"${this.#name}\": only ${this.#stockQuantity} left.`);\n        }\n        this.#stockQuantity -= amount;\n    }\n\n    restoreStock(quantity) {\n        this.#stockQuantity += Product.toQuantity(quantity);\n    }\n\n    static toQuantity(value) {\n        const parsed = Number(value);\n        if (String(value).trim() === \"\" || !Number.isSafeInteger(parsed) || parsed \u003c 1) {\n            throw new Error(\"Quantity must be a whole number of at least 1.\");\n        }\n        return parsed;\n    }\n\n    static #validateID(productID) {\n        const id = String(productID ?? \"\").trim().toUpperCase();\n        if (!/^P\\d{3,}$/.test(id)) throw new Error(\"Product ID must be \u0027P\u0027 followed by at least 3 digits (e.g., P005).\");\n        return id;\n    }\n}\n"},{"group":"Classes","name":"Customer.js","dir":"OLMS/js/models/","purpose":"Customer class: register(), login(), browseProduct(), viewProductDetails(), cart, placeOrder(), viewOrderStatus().","content":"/**\n * Customer Entity Class\n * UML: register(), login(), browseProduct(), viewProductDetails(), placeOrder(), viewOrderStatus()\n */\nclass Customer {\n    #customerID;\n    #name;\n    #email;\n    #phone;\n    #password;\n    #cart = new Map(); // productID -\u003e quantity\n\n    constructor(customerID, name, email, phone, password) {\n        this.#customerID = Validator.requireText(String(customerID ?? \"\"), \"Customer ID\");\n        this.#name = Validator.requireText(name, \"Customer name\");\n        this.#email = Validator.email(email);\n        this.#phone = Validator.phone(phone);\n        this.#password = Validator.password(password);\n    }\n\n    // --- Getters ---\n    get customerID() { return this.#customerID; }\n    get name() { return this.#name; }\n    get email() { return this.#email; }\n    get phone() { return this.#phone; }\n\n    // UML: register() — creates, validates and stores a new customer account\n    static register(customerRepo, name, email, phone, password) {\n        const customer = new Customer(customerRepo.nextId(), name, email, phone, password);\n        return customerRepo.save(customer);\n    }\n\n    // UML: login() — verifies this customer\u0027s login details\n    login(password) {\n        return this.#password === String(password ?? \"\");\n    }\n\n    // UML: browseProduct() — search and list products (empty query lists all)\n    browseProduct(productRepo, query = \"\") {\n        return productRepo.findAny(query);\n    }\n\n    // UML: viewProductDetails()\n    viewProductDetails(productRepo, productID) {\n        const product = productRepo.findById(productID);\n        if (!product) throw new Error(`Product ${productID} is no longer available.`);\n        return product.getDetails();\n    }\n\n    // --- Cart: products selected before placeOrder() ---\n    addToCart(product, quantity) {\n        const total = (this.#cart.get(product.productID) || 0) + Product.toQuantity(quantity);\n        if (total \u003e product.stockQuantity) {\n            throw new Error(`Only ${product.stockQuantity} unit(s) of \"${product.name}\" in stock.`);\n        }\n        this.#cart.set(product.productID, total);\n    }\n\n    removeFromCart(productID) { this.#cart.delete(productID); }\n    clearCart() { this.#cart.clear(); }\n\n    getCart() {\n        return [...this.#cart].map(([productID, quantity]) =\u003e ({ productID, quantity }));\n    }\n\n    // UML: placeOrder() — converts the cart into a pending Order\n    placeOrder(orderService) {\n        return orderService.placeOrder(this);\n    }\n\n    // UML: viewOrderStatus() — this customer\u0027s orders with their current status\n    viewOrderStatus(orderRepo) {\n        return orderRepo.findByCustomer(this.#customerID);\n    }\n}\n"},{"group":"Classes","name":"Staff.js","dir":"OLMS/js/models/","purpose":"Staff class: login(), manageProduct(), viewOrder(), updateOrderStatus().","content":"/**\n * Staff Entity Class\n * UML: login(), manageProduct(), viewOrder(), updateOrderStatus()\n */\nclass Staff {\n    #staffID;\n    #name;\n    #email;\n    #role;\n    #password;\n\n    constructor(staffID, name, email, role, password) {\n        this.#staffID = Validator.requireText(String(staffID ?? \"\"), \"Staff ID\");\n        this.#name = Validator.requireText(name, \"Staff name\");\n        this.#email = Validator.email(email);\n        this.#role = Validator.requireText(role, \"Staff role\");\n        this.#password = Validator.password(password);\n    }\n\n    // --- Getters ---\n    get staffID() { return this.#staffID; }\n    get name() { return this.#name; }\n    get email() { return this.#email; }\n    get role() { return this.#role; }\n\n    // UML: login() — verifies staff credentials\n    login(password) {\n        return this.#password === String(password ?? \"\");\n    }\n\n    // UML: manageProduct() — coordinates create / update / delete on the product inventory\n    manageProduct(productRepo, action, data = {}) {\n        if (action === \"create\") {\n            return productRepo.create(new Product(data.productID, data.name, data.price, data.stockQuantity));\n        }\n        if (action === \"update\") {\n            const updated = productRepo.update(data.productID, data.name, data.price, data.stockQuantity);\n            if (!updated) throw new Error(`Product ${data.productID} no longer exists.`);\n            return updated;\n        }\n        if (action === \"delete\") {\n            if (!productRepo.delete(data.productID)) throw new Error(`Product ${data.productID} no longer exists.`);\n            return true;\n        }\n        throw new Error(`Unknown product action: ${action}`);\n    }\n\n    // UML: viewOrder() — all mart orders, optionally filtered by status\n    viewOrder(orderRepo, status = \"\") {\n        const orders = orderRepo.getAll();\n        return status ? orders.filter(order =\u003e order.getOrderStatus() === status) : orders;\n    }\n\n    // UML: updateOrderStatus()\n    updateOrderStatus(orderService, orderID, newStatus) {\n        return orderService.updateOrderStatus(orderID, newStatus);\n    }\n}\n"},{"group":"Classes","name":"Order.js","dir":"OLMS/js/models/","purpose":"Order class: createOrder(), getOrderStatus(), updateStatus(); keeps the price paid for each product.","content":"/**\n * Order Entity Class\n * UML: createOrder(), getOrderStatus(), updateStatus()\n * Association: Order \"contains\" Product (price snapshot taken when the order is placed)\n */\nclass Order {\n    #orderID;\n    #customerID;\n    #items;\n    #totalAmount;\n    #status;\n    #createdAt;\n\n    constructor(orderID, customerID, items) {\n        if (!Array.isArray(items) || items.length === 0) throw new Error(\"An order must contain at least one product.\");\n        this.#orderID = orderID;\n        this.#customerID = customerID;\n        this.#items = items.map(item =\u003e Object.freeze({ ...item }));\n        this.#totalAmount = Order.#sumItems(this.#items);\n        this.#status = OrderStatus.PENDING;\n        this.#createdAt = new Date();\n    }\n\n    // UML: createOrder() — builds an order from { product, quantity } lines\n    static createOrder(orderID, customerID, lines) {\n        const items = lines.map(({ product, quantity }) =\u003e ({\n            productID: product.productID,\n            name: product.name,\n            unitPrice: product.price,\n            quantity\n        }));\n        return new Order(orderID, customerID, items);\n    }\n\n    // --- Getters ---\n    get orderID() { return this.#orderID; }\n    get customerID() { return this.#customerID; }\n    get totalAmount() { return this.#totalAmount; }\n    get createdAt() { return this.#createdAt; }\n    getItems() { return [...this.#items]; }\n\n    // UML: getOrderStatus()\n    getOrderStatus() { return this.#status; }\n\n    // UML: updateStatus() — only transitions allowed by ORDER_STATUS_FLOW\n    updateStatus(newStatus) {\n        if (!this.getNextStatuses().includes(newStatus)) {\n            throw new Error(`Cannot change order ${this.#orderID} from ${this.#status} to ${newStatus}.`);\n        }\n        this.#status = newStatus;\n    }\n\n    getNextStatuses() {\n        return [...(ORDER_STATUS_FLOW[this.#status] || [])];\n    }\n\n    // Sum in cents to avoid floating-point drift in totalAmount\n    static #sumItems(items) {\n        const cents = items.reduce((sum, item) =\u003e sum + Math.round(item.unitPrice * 100) * item.quantity, 0);\n        return cents / 100;\n    }\n}\n"},{"group":"Repositories","name":"ProductRepository.js","dir":"OLMS/js/repositories/","purpose":"Stores products: create, find by ID, search, update, delete.","content":"/**\n * ProductRepository (CRUD Service)\n * Enforces function length \u003c= 30 lines rule\n */\nclass ProductRepository {\n    #storage = [];\n\n    getAll() {\n        return [...this.#storage];\n    }\n\n    findById(productID) {\n        const id = String(productID ?? \"\").trim().toUpperCase();\n        return this.#storage.find(p =\u003e p.productID === id) || null;\n    }\n\n    // Matches ID or name; an empty query returns every product\n    findAny(query) {\n        const q = String(query ?? \"\").trim().toLowerCase();\n        if (!q) return this.getAll();\n        return this.#storage.filter(p =\u003e\n            p.productID.toLowerCase().includes(q) ||\n            p.name.toLowerCase().includes(q)\n        );\n    }\n\n    create(product) {\n        if (this.findById(product.productID)) {\n            throw new Error(`Product ID ${product.productID} already exists in database.`);\n        }\n        this.#storage.push(product);\n        return product;\n    }\n\n    update(productID, name, price, stockQuantity) {\n        const product = this.findById(productID);\n        if (!product) return null;\n        product.updateProduct(name, price, stockQuantity);\n        return product;\n    }\n\n    delete(productID) {\n        const product = this.findById(productID);\n        if (!product) return false;\n        this.#storage.splice(this.#storage.indexOf(product), 1);\n        return true;\n    }\n}\n"},{"group":"Repositories","name":"CustomerRepository.js","dir":"OLMS/js/repositories/","purpose":"Stores customer accounts and generates customer IDs (C001, C002...).","content":"/**\n * CustomerRepository — stores Customer accounts (email is unique)\n */\nclass CustomerRepository {\n    #storage = [];\n\n    nextId() {\n        return `C${String(this.#storage.length + 1).padStart(3, \"0\")}`;\n    }\n\n    save(customer) {\n        if (this.findByEmail(customer.email)) {\n            throw new Error(`An account with email ${customer.email} already exists.`);\n        }\n        this.#storage.push(customer);\n        return customer;\n    }\n\n    findByEmail(email) {\n        const query = String(email ?? \"\").trim().toLowerCase();\n        return this.#storage.find(c =\u003e c.email === query) || null;\n    }\n\n    findById(customerID) {\n        return this.#storage.find(c =\u003e c.customerID === customerID) || null;\n    }\n\n    getAll() {\n        return [...this.#storage];\n    }\n}\n"},{"group":"Repositories","name":"StaffRepository.js","dir":"OLMS/js/repositories/","purpose":"Stores staff accounts.","content":"/**\n * StaffRepository — stores mart Staff accounts (email is unique)\n */\nclass StaffRepository {\n    #storage = [];\n\n    save(staff) {\n        if (this.findByEmail(staff.email)) {\n            throw new Error(`A staff account with email ${staff.email} already exists.`);\n        }\n        this.#storage.push(staff);\n        return staff;\n    }\n\n    findByEmail(email) {\n        const query = String(email ?? \"\").trim().toLowerCase();\n        return this.#storage.find(s =\u003e s.email === query) || null;\n    }\n\n    getAll() {\n        return [...this.#storage];\n    }\n}\n"},{"group":"Repositories","name":"OrderRepository.js","dir":"OLMS/js/repositories/","purpose":"Stores orders and generates order IDs (ORD0001...).","content":"/**\n * OrderRepository — stores placed Orders\n */\nclass OrderRepository {\n    #storage = [];\n\n    nextId() {\n        return `ORD${String(this.#storage.length + 1).padStart(4, \"0\")}`;\n    }\n\n    save(order) {\n        if (this.findById(order.orderID)) throw new Error(`Order ${order.orderID} already exists.`);\n        this.#storage.push(order);\n        return order;\n    }\n\n    findById(orderID) {\n        const id = String(orderID ?? \"\").trim().toUpperCase();\n        return this.#storage.find(o =\u003e o.orderID === id) || null;\n    }\n\n    findByCustomer(customerID) {\n        return this.#storage.filter(o =\u003e o.customerID === customerID);\n    }\n\n    getAll() {\n        return [...this.#storage];\n    }\n}\n"},{"group":"Services","name":"OrderService.js","dir":"OLMS/js/services/","purpose":"Places orders (checks all stock first, then reduces it) and updates order status, returning stock on cancel.","content":"/**\n * OrderService — integrates Customer, Product and Order\n * placeOrder() is all-or-nothing: every line is validated before any stock is reduced.\n */\nclass OrderService {\n    #productRepo;\n    #orderRepo;\n\n    constructor(productRepo, orderRepo) {\n        this.#productRepo = productRepo;\n        this.#orderRepo = orderRepo;\n    }\n\n    placeOrder(customer) {\n        const cart = customer.getCart();\n        if (cart.length === 0) throw new Error(\"Your cart is empty. Add a product before placing an order.\");\n\n        const lines = cart.map(line =\u003e this.#resolveLine(line));\n        const order = Order.createOrder(this.#orderRepo.nextId(), customer.customerID, lines);\n\n        lines.forEach(({ product, quantity }) =\u003e product.reduceStock(quantity));\n        this.#orderRepo.save(order);\n        customer.clearCart();\n        return order;\n    }\n\n    updateOrderStatus(orderID, newStatus) {\n        const order = this.#orderRepo.findById(orderID);\n        if (!order) throw new Error(`Order ${orderID} not found.`);\n        order.updateStatus(newStatus);\n        if (newStatus === OrderStatus.CANCELLED) this.#restock(order);\n        return order;\n    }\n\n    #resolveLine({ productID, quantity }) {\n        const product = this.#productRepo.findById(productID);\n        if (!product) throw new Error(`Product ${productID} is no longer available. Remove it from your cart.`);\n        if (quantity \u003e product.stockQuantity) {\n            throw new Error(`Only ${product.stockQuantity} unit(s) of \"${product.name}\" left. Please update your cart.`);\n        }\n        return { product, quantity };\n    }\n\n    // Cancelled orders return their quantities to inventory (skips deleted products)\n    #restock(order) {\n        order.getItems().forEach(item =\u003e {\n            const product = this.#productRepo.findById(item.productID);\n            if (product) product.restoreStock(item.quantity);\n        });\n    }\n}\n"},{"group":"Services","name":"AuthService.js","dir":"OLMS/js/services/","purpose":"Register and login for customers and staff, and the current signed-in session.","content":"/**\n * AuthService — Register / Login use case and the active session\n */\nclass AuthService {\n    #customerRepo;\n    #staffRepo;\n    #session = null;\n\n    constructor(customerRepo, staffRepo) {\n        this.#customerRepo = customerRepo;\n        this.#staffRepo = staffRepo;\n    }\n\n    registerCustomer(name, email, phone, password) {\n        const customer = Customer.register(this.#customerRepo, name, email, phone, password);\n        this.#session = { role: \"customer\", user: customer };\n        return customer;\n    }\n\n    login(role, email, password) {\n        if (role !== \"customer\" \u0026\u0026 role !== \"staff\") throw new Error(\"Please choose Customer or Staff.\");\n        const repo = role === \"staff\" ? this.#staffRepo : this.#customerRepo;\n        const user = repo.findByEmail(email);\n        if (!user || !user.login(password)) throw new Error(\"Invalid email or password.\");\n        this.#session = { role, user };\n        return user;\n    }\n\n    logout() {\n        this.#session = null;\n    }\n\n    getSession() {\n        return this.#session;\n    }\n}\n"},{"group":"Services","name":"SystemFactory.js","dir":"OLMS/js/services/","purpose":"createSystem(): connects all repositories and services and loads the demo products and accounts.","content":"/**\n * createSystem() — wires every repository and service into one OLMS instance.\n * Used by the web app (js/ui/App.js) and by the integration tests.\n */\nfunction createSystem() {\n    const productRepo = new ProductRepository();\n    const customerRepo = new CustomerRepository();\n    const staffRepo = new StaffRepository();\n    const orderRepo = new OrderRepository();\n    const orderService = new OrderService(productRepo, orderRepo);\n    const authService = new AuthService(customerRepo, staffRepo);\n\n    seedDemoData(productRepo, customerRepo, staffRepo);\n    return { productRepo, customerRepo, staffRepo, orderRepo, orderService, authService };\n}\n\n// Demo data only — credentials are documented in OLMS/README.md\nfunction seedDemoData(productRepo, customerRepo, staffRepo) {\n    [\n        [\"P001\", \"Fresh Farm Milk 1L\", 3.50, 25],\n        [\"P002\", \"Whole Wheat Bread\", 2.80, 18],\n        [\"P003\", \"Organic Brown Eggs (10s)\", 4.20, 30],\n        [\"P004\", \"Green Gala Apples (1kg)\", 5.90, 12]\n    ].forEach(args =\u003e productRepo.create(new Product(...args)));\n\n    staffRepo.save(new Staff(\"S001\", \"Mart Manager\", \"staff@olms.test\", \"Manager\", \"staff123\"));\n    customerRepo.save(new Customer(customerRepo.nextId(), \"Demo Customer\", \"customer@olms.test\", \"012-3456789\", \"customer123\"));\n}\n"},{"group":"Functions (UI)","name":"UiHelpers.js","dir":"OLMS/js/ui/","purpose":"Shared UI functions: messages, money formatting, buttons, status badges, safe table builder, view switching.","content":"// ============================================================================\n// UI HELPERS — shared by every controller (\u003c 30 lines per function rule)\n// ============================================================================\n\nfunction byId(id) {\n    return document.getElementById(id);\n}\n\nfunction showMessage(elementId, type, text) {\n    const box = byId(elementId);\n    box.className = `message-box msg-${type}`;\n    box.textContent = text;\n}\n\nfunction clearMessage(elementId) {\n    const box = byId(elementId);\n    box.className = \"message-box\";\n    box.textContent = \"\";\n}\n\nfunction formatMoney(value) {\n    return `$${Number(value).toFixed(2)}`;\n}\n\nfunction formatDate(date) {\n    return date.toLocaleString([], { dateStyle: \"medium\", timeStyle: \"short\" });\n}\n\nfunction describeItems(order) {\n    return order.getItems().map(item =\u003e `${item.name} × ${item.quantity}`).join(\", \");\n}\n\nfunction makeButton(label, className, onClick) {\n    const button = document.createElement(\"button\");\n    button.type = \"button\";\n    button.className = className;\n    button.textContent = label;\n    button.onclick = onClick;\n    return button;\n}\n\nfunction makeStatusBadge(status) {\n    const badge = document.createElement(\"span\");\n    badge.className = `badge badge-${status.toLowerCase()}`;\n    badge.textContent = status;\n    return badge;\n}\n\n// Builds a table safely: text cells use textContent, DOM nodes are appended as-is\nfunction renderTable(container, headers, rows, emptyText) {\n    const table = document.createElement(\"table\");\n    const headRow = table.createTHead().insertRow();\n    headers.forEach(text =\u003e {\n        const th = document.createElement(\"th\");\n        th.textContent = text;\n        headRow.appendChild(th);\n    });\n    const body = table.createTBody();\n    if (rows.length === 0) {\n        const cell = body.insertRow().insertCell();\n        cell.colSpan = headers.length;\n        cell.className = \"empty-cell\";\n        cell.textContent = emptyText;\n    }\n    rows.forEach(values =\u003e {\n        const row = body.insertRow();\n        values.forEach(value =\u003e appendCell(row, value));\n    });\n    container.replaceChildren(wrapScrollable(table));\n}\n\nfunction appendCell(row, value) {\n    const cell = row.insertCell();\n    const parts = Array.isArray(value) ? value : [value];\n    parts.forEach(part =\u003e cell.append(part instanceof Node ? part : String(part)));\n}\n\nfunction wrapScrollable(table) {\n    const wrapper = document.createElement(\"div\");\n    wrapper.className = \"table-scroll\";\n    wrapper.appendChild(table);\n    return wrapper;\n}\n\nfunction showView(viewId) {\n    [\"authView\", \"customerView\", \"staffView\"].forEach(id =\u003e {\n        byId(id).classList.toggle(\"hidden\", id !== viewId);\n    });\n}\n"},{"group":"Functions (UI)","name":"AuthController.js","dir":"OLMS/js/ui/","purpose":"Login, register and logout handlers; sends each role to its own screen.","content":"// ============================================================================\n// AUTH CONTROLLER — Use Case: Register / Login (Customer \u0026 Staff)\n// ============================================================================\n\nfunction handleLogin(event) {\n    event.preventDefault();\n    try {\n        app.authService.login(byId(\"login_role\").value, byId(\"login_email\").value, byId(\"login_password\").value);\n        byId(\"loginForm\").reset();\n        clearMessage(\"loginFeedback\");\n        enterSession();\n    } catch (err) {\n        showMessage(\"loginFeedback\", \"error\", err.message);\n    }\n}\n\n// UML: Customer.register()\nfunction handleRegister(event) {\n    event.preventDefault();\n    try {\n        app.authService.registerCustomer(\n            byId(\"register_name\").value,\n            byId(\"register_email\").value,\n            byId(\"register_phone\").value,\n            byId(\"register_password\").value\n        );\n        byId(\"registerForm\").reset();\n        clearMessage(\"registerFeedback\");\n        enterSession();\n    } catch (err) {\n        showMessage(\"registerFeedback\", \"error\", err.message);\n    }\n}\n\nfunction handleLogout() {\n    app.authService.logout();\n    enterSession();\n}\n\n// Routes the active session to its role\u0027s view\nfunction enterSession() {\n    const session = app.authService.getSession();\n    byId(\"sessionInfo\").classList.toggle(\"hidden\", !session);\n    if (!session) {\n        showView(\"authView\");\n        return;\n    }\n    byId(\"sessionName\").textContent = session.user.name;\n    byId(\"sessionRole\").textContent = session.role === \"staff\" ? `Staff · ${session.user.role}` : \"Customer\";\n    if (session.role === \"staff\") {\n        showView(\"staffView\");\n        initStaffView();\n    } else {\n        showView(\"customerView\");\n        initCustomerView();\n    }\n}\n"},{"group":"Functions (UI)","name":"CustomerController.js","dir":"OLMS/js/ui/","purpose":"Customer screen functions: browse, product details, cart, place order, my orders.","content":"// ============================================================================\n// CUSTOMER CONTROLLER — Browse, View Details, Cart, Place Order, Order Status\n// ============================================================================\n\nlet catalogueQuery = \"\";\n\nfunction currentCustomer() {\n    return app.authService.getSession().user;\n}\n\nfunction initCustomerView() {\n    catalogueQuery = \"\";\n    byId(\"browse_query\").value = \"\";\n    clearMessage(\"browseFeedback\");\n    clearMessage(\"cartFeedback\");\n    byId(\"productDetailsDisplay\").textContent = \u0027Select \"Details\" on a product to view it here.\u0027;\n    renderCatalogue();\n    renderCart();\n    renderCustomerOrders();\n}\n\n// UML: Customer.browseProduct()\nfunction handleBrowseProducts(event) {\n    event.preventDefault();\n    catalogueQuery = byId(\"browse_query\").value.trim();\n    const count = renderCatalogue();\n    if (!catalogueQuery) clearMessage(\"browseFeedback\");\n    else if (count === 0) showMessage(\"browseFeedback\", \"error\", `No product matching \"${catalogueQuery}\".`);\n    else showMessage(\"browseFeedback\", \"info\", `Found ${count} matching product(s).`);\n}\n\nfunction handleShowAllProducts() {\n    byId(\"browse_query\").value = \"\";\n    catalogueQuery = \"\";\n    clearMessage(\"browseFeedback\");\n    renderCatalogue();\n}\n\nfunction renderCatalogue() {\n    const products = currentCustomer().browseProduct(app.productRepo, catalogueQuery);\n    const rows = products.map(p =\u003e [\n        p.name,\n        formatMoney(p.price),\n        p.stockQuantity \u003e 0 ? p.stockQuantity : \"Out of stock\",\n        buildCatalogueActions(p)\n    ]);\n    renderTable(byId(\"catalogueDisplay\"), [\"Product\", \"Price\", \"Stock\", \"Action\"], rows, \"No products available.\");\n    return products.length;\n}\n\nfunction buildCatalogueActions(product) {\n    const outOfStock = product.stockQuantity === 0;\n    const quantity = document.createElement(\"input\");\n    Object.assign(quantity, { type: \"number\", min: \"1\", max: String(product.stockQuantity), value: \"1\", className: \"qty-input\", disabled: outOfStock });\n    quantity.setAttribute(\"aria-label\", `Quantity of ${product.name}`);\n    const details = makeButton(\"Details\", \"btn-action btn-secondary\", () =\u003e handleViewProductDetails(product.productID));\n    const add = makeButton(\"Add\", \"btn-action\", () =\u003e handleAddToCart(product.productID, quantity.value));\n    add.disabled = outOfStock;\n    return [details, quantity, add];\n}\n\n// UML: Customer.viewProductDetails()\nfunction handleViewProductDetails(productID) {\n    try {\n        const details = currentCustomer().viewProductDetails(app.productRepo, productID);\n        const list = document.createElement(\"dl\");\n        list.className = \"details-list\";\n        [\n            [\"Product ID\", details.productID],\n            [\"Name\", details.name],\n            [\"Price\", formatMoney(details.price)],\n            [\"Stock Quantity\", details.stockQuantity],\n            [\"Availability\", details.stockQuantity \u003e 0 ? \"In stock\" : \"Out of stock\"]\n        ].forEach(([term, value]) =\u003e {\n            list.append(Object.assign(document.createElement(\"dt\"), { textContent: term }));\n            list.append(Object.assign(document.createElement(\"dd\"), { textContent: String(value) }));\n        });\n        byId(\"productDetailsDisplay\").replaceChildren(list);\n    } catch (err) {\n        showMessage(\"browseFeedback\", \"error\", err.message);\n        renderCatalogue();\n    }\n}\n\nfunction handleAddToCart(productID, quantity) {\n    try {\n        const product = app.productRepo.findById(productID);\n        if (!product) throw new Error(`Product ${productID} is no longer available.`);\n        currentCustomer().addToCart(product, quantity);\n        showMessage(\"cartFeedback\", \"success\", `Added ${quantity} × ${product.name} to cart.`);\n        renderCart();\n    } catch (err) {\n        showMessage(\"cartFeedback\", \"error\", err.message);\n    }\n}\n\nfunction handleRemoveFromCart(productID) {\n    currentCustomer().removeFromCart(productID);\n    clearMessage(\"cartFeedback\");\n    renderCart();\n}\n\nfunction renderCart() {\n    const lines = currentCustomer().getCart();\n    let totalCents = 0;\n    const rows = lines.map(({ productID, quantity }) =\u003e {\n        const product = app.productRepo.findById(productID);\n        const subtotalCents = product ? Math.round(product.price * 100) * quantity : 0;\n        totalCents += subtotalCents;\n        return [\n            product ? product.name : `${productID} (no longer available)`,\n            quantity,\n            formatMoney(subtotalCents / 100),\n            makeButton(\"Remove\", \"btn-action btn-danger\", () =\u003e handleRemoveFromCart(productID))\n        ];\n    });\n    renderTable(byId(\"cartDisplay\"), [\"Product\", \"Qty\", \"Subtotal\", \"\"], rows, \"Your cart is empty.\");\n    byId(\"cartTotal\").textContent = `Total: ${formatMoney(totalCents / 100)}`;\n    byId(\"placeOrderBtn\").disabled = lines.length === 0;\n}\n\n// UML: Customer.placeOrder() -\u003e OrderService -\u003e Order.createOrder()\nfunction handlePlaceOrder() {\n    try {\n        const order = currentCustomer().placeOrder(app.orderService);\n        showMessage(\"cartFeedback\", \"success\",\n            `Order ${order.orderID} placed. Total: ${formatMoney(order.totalAmount)}. Status: ${order.getOrderStatus()}.`);\n    } catch (err) {\n        showMessage(\"cartFeedback\", \"error\", err.message);\n    }\n    renderCart();\n    renderCatalogue();\n    renderCustomerOrders();\n}\n\n// UML: Customer.viewOrderStatus()\nfunction renderCustomerOrders() {\n    const orders = currentCustomer().viewOrderStatus(app.orderRepo).reverse();\n    const rows = orders.map(o =\u003e [\n        o.orderID,\n        formatDate(o.createdAt),\n        describeItems(o),\n        formatMoney(o.totalAmount),\n        makeStatusBadge(o.getOrderStatus())\n    ]);\n    renderTable(byId(\"customerOrdersDisplay\"), [\"Order ID\", \"Placed\", \"Products\", \"Total\", \"Status\"], rows,\n        \"You have not placed any orders yet.\");\n}\n"},{"group":"Functions (UI)","name":"StaffProductController.js","dir":"OLMS/js/ui/","purpose":"Staff product functions: the Lab 3 \u0026 4 create, search, edit, delete and inventory table.","content":"// ============================================================================\n// STAFF PRODUCT CONTROLLER — Lab 3 \u0026 4 Product CRUD, now via Staff.manageProduct()\n// ============================================================================\n\nlet lastStaffSearch = \"\";\n\nfunction currentStaff() {\n    return app.authService.getSession().user;\n}\n\nfunction initStaffView() {\n    closeEditWorkspace();\n    byId(\"createProductForm\").reset();\n    byId(\"search_query\").value = \"\";\n    lastStaffSearch = \"\";\n    byId(\"searchResultsDisplay\").replaceChildren();\n    clearMessage(\"createFeedback\");\n    clearMessage(\"searchFeedback\");\n    renderInventoryTable();\n    initOrderManagement();\n}\n\nfunction readProductForm(prefix) {\n    return {\n        productID: byId(`${prefix}_productID`).value,\n        name: byId(`${prefix}_name`).value,\n        price: byId(`${prefix}_price`).value,\n        stockQuantity: byId(`${prefix}_stockQuantity`).value\n    };\n}\n\n// Keeps the inventory table and any open search results in sync after a change\nfunction refreshProductViews() {\n    renderInventoryTable();\n    if (lastStaffSearch) renderSearchResults(lastStaffSearch);\n}\n\n// Activity 5: Data Display Function Construction\nfunction renderInventoryTable() {\n    const rows = app.productRepo.getAll().map(p =\u003e [\n        p.productID,\n        p.name,\n        formatMoney(p.price),\n        p.stockQuantity,\n        [\n            makeButton(\"Edit\", \"btn-action\", () =\u003e openEditWorkspace(p.productID)),\n            makeButton(\"Delete\", \"btn-action btn-danger\", () =\u003e confirmDirectDelete(p.productID))\n        ]\n    ]);\n    renderTable(byId(\"inventoryDisplay\"), [\"Product ID\", \"Product Name\", \"Price\", \"Stock Quantity\", \"Operations\"], rows,\n        \"No products found in system.\");\n}\n\n// Activity 1: Create Function Construction\nfunction handleCreateProduct(event) {\n    event.preventDefault();\n    try {\n        const product = currentStaff().manageProduct(app.productRepo, \"create\", readProductForm(\"create\"));\n        showMessage(\"createFeedback\", \"success\", `Product [${product.productID}] \"${product.name}\" created successfully.`);\n        byId(\"createProductForm\").reset();\n        refreshProductViews();\n    } catch (err) {\n        showMessage(\"createFeedback\", \"error\", err.message);\n    }\n}\n\n// Activity 2: Search Function Construction\nfunction handleSearchProduct(event) {\n    event.preventDefault();\n    lastStaffSearch = byId(\"search_query\").value.trim();\n    if (!lastStaffSearch) {\n        byId(\"searchResultsDisplay\").replaceChildren();\n        showMessage(\"searchFeedback\", \"error\", \"Please enter a Product ID or name to search.\");\n        return;\n    }\n    renderSearchResults(lastStaffSearch);\n}\n\nfunction renderSearchResults(query) {\n    const matches = app.productRepo.findAny(query);\n    const container = byId(\"searchResultsDisplay\");\n    if (matches.length === 0) {\n        container.replaceChildren();\n        showMessage(\"searchFeedback\", \"error\", `Not found: No product matching \"${query}\".`);\n        return;\n    }\n    showMessage(\"searchFeedback\", \"info\", `Search successful: Found ${matches.length} matching product(s).`);\n    const rows = matches.map(p =\u003e [\n        p.productID, p.name, formatMoney(p.price), p.stockQuantity,\n        makeButton(\"Select\", \"btn-action\", () =\u003e openEditWorkspace(p.productID))\n    ]);\n    renderTable(container, [\"ID\", \"Name\", \"Price\", \"Stock\", \"Action\"], rows, \"\");\n}\n\n// Activity 3: Edit Function Construction\nfunction openEditWorkspace(productID) {\n    const product = app.productRepo.findById(productID);\n    if (!product) {\n        showMessage(\"searchFeedback\", \"error\", `Product ${productID} no longer exists.`);\n        refreshProductViews();\n        return false;\n    }\n    byId(\"edit_productID\").value = product.productID;\n    byId(\"edit_name\").value = product.name;\n    byId(\"edit_price\").value = product.price.toFixed(2);\n    byId(\"edit_stockQuantity\").value = product.stockQuantity;\n    byId(\"editTitle\").textContent = `3 \u0026 4. Edit / Delete Product ${product.productID}`;\n    showMessage(\"editFeedback\", \"info\", `Loaded product ${product.productID} for editing.`);\n    byId(\"editDeleteSection\").classList.remove(\"hidden\");\n    byId(\"editDeleteSection\").scrollIntoView({ behavior: \"smooth\" });\n    return true;\n}\n\nfunction handleSaveEdit(event) {\n    event.preventDefault();\n    try {\n        const product = currentStaff().manageProduct(app.productRepo, \"update\", readProductForm(\"edit\"));\n        byId(\"edit_price\").value = product.price.toFixed(2);\n        showMessage(\"editFeedback\", \"success\", `Product ${product.productID} updated successfully. Validation verified.`);\n        refreshProductViews();\n    } catch (err) {\n        showMessage(\"editFeedback\", \"error\", err.message);\n    }\n}\n\n// Activity 4: Delete Function Construction — returns true only if deleted\nfunction handleDeletePrompt() {\n    const product = app.productRepo.findById(byId(\"edit_productID\").value);\n    if (!product) return false;\n    const confirmed = confirm(\n        `Confirm Deletion?\\n\\n` +\n        `Product ID: ${product.productID}\\n` +\n        `Name: ${product.name}\\n` +\n        `Price: ${formatMoney(product.price)}\\n` +\n        `Stock: ${product.stockQuantity}\\n\\n` +\n        `Are you sure you want to delete this record?`\n    );\n    if (!confirmed) return false;\n    currentStaff().manageProduct(app.productRepo, \"delete\", { productID: product.productID });\n    closeEditWorkspace();\n    refreshProductViews();\n    alert(`Product ${product.productID} has been permanently deleted.`);\n    return true;\n}\n\nfunction confirmDirectDelete(productID) {\n    if (!openEditWorkspace(productID)) return;\n    if (!handleDeletePrompt()) closeEditWorkspace();\n}\n\nfunction closeEditWorkspace() {\n    byId(\"editDeleteSection\").classList.add(\"hidden\");\n    byId(\"editForm\").reset();\n    clearMessage(\"editFeedback\");\n}\n"},{"group":"Functions (UI)","name":"StaffOrderController.js","dir":"OLMS/js/ui/","purpose":"Staff order functions: view orders, filter by status, update status.","content":"// ============================================================================\n// STAFF ORDER CONTROLLER — Use Cases: View Order, Update Order Status\n// ============================================================================\n\nfunction initOrderManagement() {\n    byId(\"order_status_filter\").value = \"\";\n    clearMessage(\"orderFeedback\");\n    renderOrderManagement();\n}\n\n// UML: Staff.viewOrder()\nfunction renderOrderManagement() {\n    const orders = currentStaff().viewOrder(app.orderRepo, byId(\"order_status_filter\").value).reverse();\n    const rows = orders.map(o =\u003e [\n        o.orderID,\n        describeCustomer(o.customerID),\n        describeItems(o),\n        formatMoney(o.totalAmount),\n        makeStatusBadge(o.getOrderStatus()),\n        buildStatusControls(o)\n    ]);\n    renderTable(byId(\"orderManagementDisplay\"), [\"Order ID\", \"Customer\", \"Products\", \"Total\", \"Status\", \"Update Status\"],\n        rows, \"No orders found.\");\n}\n\nfunction describeCustomer(customerID) {\n    const customer = app.customerRepo.findById(customerID);\n    return customer ? `${customer.name} (${customerID})` : customerID;\n}\n\nfunction buildStatusControls(order) {\n    const nextStatuses = order.getNextStatuses();\n    if (nextStatuses.length === 0) return \"Final\";\n    const select = document.createElement(\"select\");\n    select.className = \"status-select\";\n    select.setAttribute(\"aria-label\", `New status for ${order.orderID}`);\n    nextStatuses.forEach(status =\u003e select.add(new Option(status, status)));\n    const button = makeButton(\"Update\", \"btn-action\", () =\u003e handleUpdateOrderStatus(order.orderID, select.value));\n    return [select, button];\n}\n\n// UML: Staff.updateOrderStatus() -\u003e OrderService -\u003e Order.updateStatus()\nfunction handleUpdateOrderStatus(orderID, newStatus) {\n    try {\n        const order = currentStaff().updateOrderStatus(app.orderService, orderID, newStatus);\n        const note = newStatus === OrderStatus.CANCELLED ? \" Stock has been returned to inventory.\" : \"\";\n        showMessage(\"orderFeedback\", \"success\", `Order ${order.orderID} is now ${order.getOrderStatus()}.${note}`);\n        renderInventoryTable();\n    } catch (err) {\n        showMessage(\"orderFeedback\", \"error\", err.message);\n    }\n    renderOrderManagement();\n}\n"},{"group":"Functions (UI)","name":"App.js","dir":"OLMS/js/ui/","purpose":"Starts the app: creates the system and shows the login screen. Must load last.","content":"// ============================================================================\n// APP — composition root: one shared OLMS instance for every module\n// ============================================================================\n\nconst app = createSystem();\n\n// Initialize display on load\nenterSession();\n"},{"group":"Tests","name":"IntegrationTests.html","dir":"OLMS/tests/","purpose":"Open this page in a browser to run the integration tests.","content":"\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eOLMS Integration Tests\u003c/title\u003e\n    \u003cstyle\u003e\n        body { font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif; background: #f1f5f9; color: #334155; padding: 24px; }\n        h1 { font-size: 20px; color: #0f172a; margin-bottom: 12px; }\n        .summary { font-weight: 700; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }\n        .summary.pass { background: #dcfce7; color: #166534; }\n        .summary.fail { background: #fee2e2; color: #991b1b; }\n        ul { list-style: none; padding: 0; }\n        li { background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px 12px; margin-bottom: 6px; font-size: 13px; }\n        li.pass { border-left: 4px solid #16a34a; }\n        li.fail { border-left: 4px solid #dc2626; color: #991b1b; }\n    \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003ch1\u003eOLMS Integration Tests\u003c/h1\u003e\n    \u003cdiv id=\"summary\" class=\"summary\"\u003eRunning…\u003c/div\u003e\n    \u003cul id=\"results\"\u003e\u003c/ul\u003e\n\n    \u003cscript src=\"../js/models/OrderStatus.js\"\u003e\u003c/script\u003e\n    \u003cscript src=\"../js/models/Validator.js\"\u003e\u003c/script\u003e\n    \u003cscript src=\"../js/models/Product.js\"\u003e\u003c/script\u003e\n    \u003cscript src=\"../js/models/Customer.js\"\u003e\u003c/script\u003e\n    \u003cscript src=\"../js/models/Staff.js\"\u003e\u003c/script\u003e\n    \u003cscript src=\"../js/models/Order.js\"\u003e\u003c/script\u003e\n    \u003cscript src=\"../js/repositories/ProductRepository.js\"\u003e\u003c/script\u003e\n    \u003cscript src=\"../js/repositories/CustomerRepository.js\"\u003e\u003c/script\u003e\n    \u003cscript src=\"../js/repositories/StaffRepository.js\"\u003e\u003c/script\u003e\n    \u003cscript src=\"../js/repositories/OrderRepository.js\"\u003e\u003c/script\u003e\n    \u003cscript src=\"../js/services/OrderService.js\"\u003e\u003c/script\u003e\n    \u003cscript src=\"../js/services/AuthService.js\"\u003e\u003c/script\u003e\n    \u003cscript src=\"../js/services/SystemFactory.js\"\u003e\u003c/script\u003e\n    \u003cscript src=\"IntegrationTests.js\"\u003e\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"},{"group":"Tests","name":"IntegrationTests.js","dir":"OLMS/tests/","purpose":"18 integration tests covering every use case across all four classes.","content":"// ============================================================================\n// OLMS INTEGRATION TESTS — every use case across Customer, Staff, Product, Order\n// Each test gets a fresh system from createSystem() so tests never share state.\n// ============================================================================\n\nconst testCases = [];\n\nfunction test(name, fn) {\n    testCases.push({ name, fn });\n}\n\nfunction assertEqual(actual, expected, label) {\n    if (actual !== expected) throw new Error(`${label}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);\n}\n\nfunction assertThrows(fn, expectedText) {\n    try {\n        fn();\n    } catch (err) {\n        if (expectedText \u0026\u0026 !err.message.includes(expectedText)) {\n            throw new Error(`Wrong error. Expected text \"${expectedText}\", got \"${err.message}\"`);\n        }\n        return;\n    }\n    throw new Error(`Expected an error containing \"${expectedText}\"`);\n}\n\nfunction loginDemoCustomer(sys) {\n    return sys.authService.login(\"customer\", \"customer@olms.test\", \"customer123\");\n}\n\nfunction loginDemoStaff(sys) {\n    return sys.authService.login(\"staff\", \"staff@olms.test\", \"staff123\");\n}\n\n// --- Register / Login ---\ntest(\"System seeds 4 products, 1 staff and 1 customer\", () =\u003e {\n    const sys = createSystem();\n    assertEqual(sys.productRepo.getAll().length, 4, \"products\");\n    assertEqual(sys.staffRepo.getAll().length, 1, \"staff\");\n    assertEqual(sys.customerRepo.getAll().length, 1, \"customers\");\n});\n\ntest(\"Customer.register() creates an account, starts a session and can log in again\", () =\u003e {\n    const sys = createSystem();\n    const customer = sys.authService.registerCustomer(\"Aina Rahman\", \"Aina@Example.com\", \"013-9876543\", \"secret1\");\n    assertEqual(customer.customerID, \"C002\", \"new customer ID\");\n    assertEqual(sys.authService.getSession().user, customer, \"session user\");\n    sys.authService.logout();\n    assertEqual(sys.authService.login(\"customer\", \"aina@example.com\", \"secret1\"), customer, \"re-login\");\n});\n\ntest(\"Registration rejects duplicate email and invalid details\", () =\u003e {\n    const sys = createSystem();\n    assertThrows(() =\u003e sys.authService.registerCustomer(\"Dup\", \"customer@olms.test\", \"0123456789\", \"secret1\"), \"already exists\");\n    assertThrows(() =\u003e sys.authService.registerCustomer(\"Bad\", \"not-an-email\", \"0123456789\", \"secret1\"), \"valid email\");\n    assertThrows(() =\u003e sys.authService.registerCustomer(\"Bad\", \"b@x.com\", \"12\", \"secret1\"), \"Phone\");\n    assertThrows(() =\u003e sys.authService.registerCustomer(\"Bad\", \"c@x.com\", \"0123456789\", \"123\"), \"at least 6\");\n    assertEqual(sys.customerRepo.getAll().length, 1, \"no partial accounts saved\");\n});\n\ntest(\"Login rejects wrong password and wrong role\", () =\u003e {\n    const sys = createSystem();\n    assertThrows(() =\u003e sys.authService.login(\"customer\", \"customer@olms.test\", \"nope\"), \"Invalid email or password\");\n    assertThrows(() =\u003e sys.authService.login(\"staff\", \"customer@olms.test\", \"customer123\"), \"Invalid email or password\");\n    assertEqual(sys.authService.getSession(), null, \"no session after failed login\");\n    assertEqual(loginDemoStaff(sys).role, \"Manager\", \"staff login\");\n});\n\n// --- Browse / View Product Details ---\ntest(\"Customer.browseProduct() searches by name or ID; blank query lists all\", () =\u003e {\n    const sys = createSystem();\n    const customer = loginDemoCustomer(sys);\n    assertEqual(customer.browseProduct(sys.productRepo, \"bread\").length, 1, \"name search\");\n    assertEqual(customer.browseProduct(sys.productRepo, \"p00\").length, 4, \"ID search\");\n    assertEqual(customer.browseProduct(sys.productRepo, \"   \").length, 4, \"blank query\");\n    assertEqual(customer.browseProduct(sys.productRepo, \"caviar\").length, 0, \"no match\");\n});\n\ntest(\"Customer.viewProductDetails() returns Product.getDetails()\", () =\u003e {\n    const sys = createSystem();\n    const details = loginDemoCustomer(sys).viewProductDetails(sys.productRepo, \"p003\");\n    assertEqual(details.name, \"Organic Brown Eggs (10s)\", \"name\");\n    assertEqual(details.price, 4.2, \"price\");\n    assertEqual(details.stockQuantity, 30, \"stockQuantity\");\n});\n\n// --- Cart / Place Order ---\ntest(\"Cart merges repeated products and blocks quantities above stock\", () =\u003e {\n    const sys = createSystem();\n    const customer = loginDemoCustomer(sys);\n    const apples = sys.productRepo.findById(\"P004\"); // stock 12\n    customer.addToCart(apples, 5);\n    customer.addToCart(apples, \"7\");\n    assertEqual(customer.getCart()[0].quantity, 12, \"merged quantity\");\n    assertThrows(() =\u003e customer.addToCart(apples, 1), \"Only 12\");\n    assertThrows(() =\u003e customer.addToCart(apples, 0), \"at least 1\");\n    assertThrows(() =\u003e customer.addToCart(apples, 1.5), \"whole number\");\n});\n\ntest(\"Customer.placeOrder() creates a Pending order, reduces stock and clears the cart\", () =\u003e {\n    const sys = createSystem();\n    const customer = loginDemoCustomer(sys);\n    customer.addToCart(sys.productRepo.findById(\"P001\"), 2); // 2 x 3.50\n    customer.addToCart(sys.productRepo.findById(\"P002\"), 3); // 3 x 2.80\n    const order = customer.placeOrder(sys.orderService);\n    assertEqual(order.orderID, \"ORD0001\", \"orderID\");\n    assertEqual(order.totalAmount, 15.4, \"totalAmount\");\n    assertEqual(order.getOrderStatus(), OrderStatus.PENDING, \"status\");\n    assertEqual(sys.productRepo.findById(\"P001\").stockQuantity, 23, \"P001 stock\");\n    assertEqual(sys.productRepo.findById(\"P002\").stockQuantity, 15, \"P002 stock\");\n    assertEqual(customer.getCart().length, 0, \"cart cleared\");\n});\n\ntest(\"placeOrder() is all-or-nothing when one product runs out\", () =\u003e {\n    const sys = createSystem();\n    const customer = loginDemoCustomer(sys);\n    customer.addToCart(sys.productRepo.findById(\"P001\"), 2);\n    customer.addToCart(sys.productRepo.findById(\"P004\"), 10);\n    loginDemoStaff(sys).manageProduct(sys.productRepo, \"update\", { productID: \"P004\", name: \"Green Gala Apples (1kg)\", price: 5.9, stockQuantity: 3 });\n    assertThrows(() =\u003e customer.placeOrder(sys.orderService), \"Only 3\");\n    assertEqual(sys.productRepo.findById(\"P001\").stockQuantity, 25, \"P001 untouched\");\n    assertEqual(sys.orderRepo.getAll().length, 0, \"no order saved\");\n    assertEqual(customer.getCart().length, 2, \"cart kept for correction\");\n});\n\ntest(\"placeOrder() rejects an empty cart and a product deleted by staff\", () =\u003e {\n    const sys = createSystem();\n    const customer = loginDemoCustomer(sys);\n    assertThrows(() =\u003e customer.placeOrder(sys.orderService), \"cart is empty\");\n    customer.addToCart(sys.productRepo.findById(\"P002\"), 1);\n    loginDemoStaff(sys).manageProduct(sys.productRepo, \"delete\", { productID: \"P002\" });\n    assertThrows(() =\u003e customer.placeOrder(sys.orderService), \"no longer available\");\n});\n\ntest(\"Order keeps the price paid even if staff later changes the product pric
